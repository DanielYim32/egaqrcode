<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EGA x AIA Scanner</title>
  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; color:#0f0; font-family:Arial; text-align:center; }
    #start { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    #start button { font-size:50px; padding:30px 60px; background:#0f0; color:#000; border:none; border-radius:20px; cursor:pointer; box-shadow:0 0 30px #0f0; }
    #result { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; }
    .valid { background:#000; color:#00ff88; }
    .used { background:#000; color:#ff4444; }
    h1 { font-size:90px; margin:0; }
    p { font-size:40px; margin:20px 0 0; }
  </style>
</head>
<body>

  <div id="start">
    <h1>EGA x AIA</h1>
    <button id="scanBtn">CLICK TO SCAN</button>
  </div>

  <div id="result" style="display:none"></div>

  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script>
    const startDiv = document.getElementById('start');
    const resultDiv = document.getElementById('result');
    const scanBtn = document.getElementById('scanBtn');

    // ←←← YOUR SECRET KEY (must match Google Script) ←←←
    const SECRET_KEY = "candle2025ega!";

    scanBtn.onclick = () => {
      startDiv.style.display = 'none';
      resultDiv.style.display = 'flex';
      resultDiv.innerHTML = '<p>Opening camera...</p>';

      const codeReader = new ZXing.BrowserQRCodeReader();
      codeReader.decodeFromVideoDevice(undefined, null, (result, err) => {
        if (result) {
          const url = result.getText() + "&key=" + SECRET_KEY;
          fetch(url)
            .then(r => r.text())
            .then(html => {
              resultDiv.innerHTML = html;  // shows your GREEN / RED screen
              setTimeout(() => location.reload(), 4000);  // back to "CLICK TO SCAN"
            })
            .catch(() => {
              resultDiv.innerHTML = '<div class="used"><h1>Network Error</h1></div>';
              setTimeout(() => location.reload(), 4000);
            });
        }
      });
    };
  </script>
</body>
</html>
